<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petr Kubelka · Relay</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #0a0a0a;
    --muted: #555555;
    --dim: #737373;
    --accent: #0a0a0a;
    --live: #0a0a0a;
    --panel: #ffffff;
    --soft: #f3f3f3;
    --line: #e2e2e2;
    /* 1% of the height of a 16:9 frame that fits the window. */
    --u: min(1vh, 0.5625vw);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: calc(var(--u) * 3);
    line-height: 1.15;
    -webkit-font-smoothing: antialiased;
  }

  #progress { position: fixed; top: 0; left: 0; height: 6px; width: 0; background: var(--accent); z-index: 10; }

  #stage {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: calc(var(--u) * 177.78); height: calc(var(--u) * 100);
    display: grid; grid-template-columns: minmax(0, 1fr) calc(var(--u) * 71);
    gap: calc(var(--u) * 7); align-items: center;
    padding: calc(var(--u) * 8) calc(var(--u) * 9) calc(var(--u) * 9) calc(var(--u) * 10.7);
  }

  /* Spoken lines */
  #words { display: flex; flex-direction: column; justify-content: center; gap: calc(var(--u) * 2.4); min-height: 0; }
  .lockup { display: grid; gap: calc(var(--u) * 1); margin-bottom: calc(var(--u) * 1.5); transition: opacity .4s ease; }
  .lockup .name { font-size: calc(var(--u) * 4.4); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
  .lockup .brand { font-size: calc(var(--u) * 15); font-weight: 900; letter-spacing: -0.045em; line-height: .9; color: var(--accent); }
  .lockup.gone { display: none; }
  .line {
    font-size: calc(var(--u) * 7.6); font-weight: 800; letter-spacing: -0.025em; line-height: 1.06;
    text-wrap: balance;
    animation: rise .45s ease both;
  }
  .line.past { font-size: calc(var(--u) * 3.8); font-weight: 700; letter-spacing: -0.01em; color: var(--dim); animation: none; }
  .line.long { font-size: calc(var(--u) * 6); }
  .line.long.past { font-size: calc(var(--u) * 3.8); }
  .line .accent { color: var(--accent); font-weight: 900; }
  .line.past .accent { color: inherit; }
  @keyframes rise { from { opacity: 0; transform: translateY(calc(var(--u) * 2.5)); } }

  /* Product */
  #side {
    display: flex; flex-direction: column; gap: calc(var(--u) * 2.2); min-height: 0;
    max-height: calc(var(--u) * 83);
    opacity: 0; transform: translateY(calc(var(--u) * 3));
    transition: opacity .6s ease, transform .6s ease;
  }
  body.app-on #side { opacity: 1; transform: none; }
  #outcomes { list-style: none; display: flex; gap: calc(var(--u) * 1.4); flex-wrap: wrap; }
  #outcomes li {
    font-size: calc(var(--u) * 3); font-weight: 800; color: var(--dim);
    border: 3px solid var(--line); border-radius: 999px; padding: calc(var(--u) * .7) calc(var(--u) * 2.2);
    transition: color .4s ease, border-color .4s ease, background .4s ease;
  }
  #outcomes li.on { color: var(--bg); background: var(--accent); border-color: var(--accent); }
  #app {
    background: var(--panel); border: 2px solid var(--line); border-radius: calc(var(--u) * 2.4);
    box-shadow: 0 calc(var(--u) * 2) calc(var(--u) * 6) rgba(0, 0, 0, .08);
    display: grid; grid-template-rows: auto auto auto 1fr; overflow: hidden; min-height: 0;
  }
  .level { padding: 0 calc(var(--u) * 3) calc(var(--u) * 2.2); font-size: calc(var(--u) * 3); font-weight: 800; min-height: 1.2em; }
  .fix {
    display: none; margin: 0 calc(var(--u) * 3) calc(var(--u) * 2.4);
    border-left: calc(var(--u) * 0.8) solid var(--accent); background: var(--soft);
    padding: calc(var(--u) * 1.2) calc(var(--u) * 1.8);
    font-size: calc(var(--u) * 2.8); font-weight: 700; line-height: 1.25;
  }
  .fix-label { display: block; color: var(--accent); font-size: calc(var(--u) * 2.2); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin-bottom: calc(var(--u) * .6); }
  body.fixing .fix { display: block; animation: rise .45s ease both; }
  .bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: calc(var(--u) * 1.8) calc(var(--u) * 3); border-bottom: 2px solid var(--line);
    font-size: calc(var(--u) * 2.8); font-weight: 800;
  }
  .bar .brand { color: var(--accent); }
  .rec { display: inline-flex; align-items: center; gap: calc(var(--u) * 1.2); color: var(--muted); }
  .rec i { width: calc(var(--u) * 2); height: calc(var(--u) * 2); border-radius: 50%; background: var(--live); animation: pulse 1s ease-in-out infinite; }
  body.paused .rec i { animation-play-state: paused; }
  @keyframes pulse { 50% { opacity: .25; } }

  .score { display: flex; align-items: baseline; gap: calc(var(--u) * 1.4); padding: calc(var(--u) * 2.6) calc(var(--u) * 3) calc(var(--u) * 1); font-variant-numeric: tabular-nums; }
  .score .num { font-size: calc(var(--u) * 14); font-weight: 900; letter-spacing: -0.05em; line-height: .85; color: var(--accent); }
  .score .of { font-size: calc(var(--u) * 5); font-weight: 800; color: var(--muted); }
  .meter { margin: 0 calc(var(--u) * 3) calc(var(--u) * 1.8); height: calc(var(--u) * 1.4); background: var(--line); border-radius: 999px; overflow: hidden; }
  .meter b { display: block; height: 100%; width: 0; background: var(--accent); transition: width .5s ease; }

  .transcript {
    padding: 0 calc(var(--u) * 3) calc(var(--u) * 3);
    display: flex; flex-direction: column; justify-content: flex-end; gap: calc(var(--u) * 1.1);
    overflow: hidden; min-height: 0;
    font-size: calc(var(--u) * 2.6); font-weight: 600; line-height: 1.3; color: var(--muted);
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 4em);
    mask-image: linear-gradient(to bottom, transparent, #000 4em);
  }
  .transcript p:last-child { color: var(--fg); }
  .caret { display: inline-block; width: .45em; height: 1em; background: var(--accent); vertical-align: -0.12em; margin-left: .12em; }

  #corner {
    position: absolute; left: calc(var(--u) * 10.7); bottom: calc(var(--u) * 3.2); z-index: 5;
    font-size: calc(var(--u) * 2.8); font-weight: 800; letter-spacing: .04em; color: var(--muted);
    opacity: 0; transition: opacity .4s ease;
  }
  #corner b { color: var(--accent); font-weight: 900; }
  body.corner #corner { opacity: 1; }

  #pause {
    position: fixed; top: calc(var(--u) * 2.4); left: 50%; transform: translateX(-50%); display: none; z-index: 20;
    border: 3px solid var(--accent); border-radius: calc(var(--u) * 1.6); padding: calc(var(--u) * .8) calc(var(--u) * 2.4);
    background: var(--bg); color: var(--accent); font-weight: 800; font-size: calc(var(--u) * 3);
  }
  body.paused #pause { display: block; }

  body.seeked .line, body.seeked .fix { animation: none; }
  @media (prefers-reduced-motion: reduce) {
    .line { animation: none; }
    .rec i { animation: none; }
  }
</style>
</head>
<body>
<div id="progress" role="progressbar" aria-label="Film progress" aria-valuemin="0" aria-valuemax="60" aria-valuenow="0"></div>

<main id="stage">
  <div id="words" aria-live="polite">
    <div class="lockup" id="lockup"><div class="name">Petr Kubelka</div><div class="brand">Relay</div></div>
  </div>
  <div id="side">
    <ul id="outcomes" aria-label="Judging">
      <li data-outcome="execution">Execution</li>
      <li data-outcome="usefulness">Usefulness</li>
      <li data-outcome="clarity">Clarity</li>
    </ul>
    <section id="app" aria-label="Relay">
      <div class="bar"><span class="brand">Relay</span><span class="rec"><i></i>Live</span></div>
      <div>
        <div class="score"><span class="num" id="score">–</span><span class="of">/ 10</span></div>
        <div class="meter"><b id="meter"></b></div>
        <div class="level" id="level"></div>
      </div>
      <div class="fix" id="fix"><span class="fix-label">Line to fix</span><span id="fix-text"></span></div>
      <div class="transcript" id="transcript"></div>
    </section>
  </div>
  <div id="corner">Petr Kubelka · <b>Relay</b></div>
</main>

<div id="pause">Paused</div>

<script>
(function () {
  var DURATION = 60;

  // The spoken script, verbatim from the "60 seconds" section of pitch.md.
  // `at` is the section timestamp in seconds; sentences inside a section are
  // spaced by word count. *Asterisks* mark emphasised words.
  // A leading [outcome] tag lights that judging outcome when the sentence is spoken.
  var PITCH = [
    { at: 0, lines: [
      'Hackathon teams find out their pitch failed only after they sit down.',
      'By then the judges have moved on, and nobody tells you which sentence lost them.'
    ] },
    { at: 10, lines: [
      '[usefulness]*Relay* fixes that before you stand up.',
      'You say your pitch out loud, and Relay gives you *one number out of ten* for a single question: how well does this pitch explain an idea that helps developers?',
      '[clarity]Then it gives you *one line to fix.*',
      'Not a list.',
      'One line.',
      'You fix that line, say it again, and the number climbs.'
    ] },
    { at: 32, lines: [
      '[execution]That is *working right now.*',
      'The live app is beside me, and it is scoring these exact words while I say them.',
      'I am pitching *Relay* on *Relay*.'
    ] },
    { at: 42, lines: [
      'Today I am building it.',
      'Next, every team at this hackathon rehearses with it before they present.'
    ] },
    { at: 50, lines: [
      'So here is what to try next: say your pitch to Relay, fix the one line it gives you, and *walk in already knowing your number.*'
    ] }
  ];

  // Live result for these exact words from the Relay API (pitch.md, "Live scores").
  var FINAL = 9.6;
  var LEVEL = 'A developer would know what to try next';
  // The score moves while the pitch is spoken and reaches the live result.
  var SCORE_FROM = 10, SCORE_TO = 41;
  var SCORES = [4.2, 5.1, 4.7, 6.0, 6.9, 6.6, 7.8, 8.5, 9.1, 9.6];
  var LAST_LINE_END = 57;

  var lines = [];
  PITCH.forEach(function (sec, s) {
    var end = s + 1 < PITCH.length ? PITCH[s + 1].at : LAST_LINE_END;
    var parsed = sec.lines.map(function (raw) {
      var mm = /^\[(\w+)\]/.exec(raw);
      return { outcome: mm ? mm[1] : null, text: mm ? raw.slice(mm[0].length) : raw };
    });
    var words = parsed.map(function (l) { return l.text.split(/\s+/).length; });
    var total = words.reduce(function (a, b) { return a + b; }, 0);
    var t = sec.at + 0.2, span = end - sec.at - 0.2;
    parsed.forEach(function (l, i) {
      lines.push({
        at: t, section: s, outcome: l.outcome, words: words[i],
        text: l.text.replace(/\*/g, ''),
        html: l.text.replace(/\*([^*]+)\*/g, '<span class="accent">$1</span>')
      });
      t += span * words[i] / total;
    });
  });
  var OUTCOME_AT = {};
  lines.forEach(function (l) { if (l.outcome) OUTCOME_AT[l.outcome] = l.at; });
  var FIX_AT = OUTCOME_AT.clarity;
  // The opening is the line to fix first (pitch.md, "How to train").
  var FIX_TEXT = lines[0].text;

  var body = document.body;
  var wordsEl = document.getElementById('words');
  var lockup = document.getElementById('lockup');
  var progress = document.getElementById('progress');
  var scoreEl = document.getElementById('score');
  var meter = document.getElementById('meter');
  var transcript = document.getElementById('transcript');
  var levelEl = document.getElementById('level');
  var outcomeEls = Array.prototype.slice.call(document.querySelectorAll('#outcomes li'));
  document.getElementById('fix-text').textContent = '“' + FIX_TEXT + '”';
  var paused = false;
  var shownKey = '';

  function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }

  function renderWords(t) {
    var cur = -1;
    for (var i = 0; i < lines.length; i++) if (t >= lines[i].at) cur = i;
    var section = cur < 0 ? 0 : lines[cur].section;
    var key = section + ':' + cur;
    if (key === shownKey) return;
    shownKey = key;
    lockup.classList.toggle('gone', section !== 0);
    Array.prototype.slice.call(wordsEl.querySelectorAll('.line')).forEach(function (n) { n.remove(); });
    for (var j = 0; j <= cur; j++) {
      if (lines[j].section !== section) continue;
      var p = document.createElement('p');
      p.className = 'line' + (lines[j].words > 18 ? ' long' : '') + (j < cur ? ' past' : '');
      p.innerHTML = lines[j].html;
      wordsEl.appendChild(p);
    }
  }

  function renderApp(t) {
    body.classList.toggle('app-on', t >= SCORE_FROM);
    body.classList.toggle('fixing', t >= FIX_AT);
    outcomeEls.forEach(function (li) { li.classList.toggle('on', t >= OUTCOME_AT[li.dataset.outcome]); });

    var sp = clamp01((t - SCORE_FROM) / (SCORE_TO - SCORE_FROM));
    var v = t >= SCORE_TO ? FINAL : SCORES[Math.min(SCORES.length - 1, Math.floor(sp * SCORES.length))];
    scoreEl.textContent = t < SCORE_FROM ? '–' : v.toFixed(1);
    meter.style.width = (t < SCORE_FROM ? 0 : v * 10) + '%';
    levelEl.textContent = t >= SCORE_TO ? LEVEL : '';

    // The transcript is what has been spoken so far.
    var heard = lines.filter(function (l) { return l.at <= t; });
    if (heard.length === transcript.childElementCount) return;
    transcript.innerHTML = '';
    heard.forEach(function (l, i) {
      var p = document.createElement('p');
      p.textContent = l.text;
      if (i === heard.length - 1) { var c = document.createElement('span'); c.className = 'caret'; p.appendChild(c); }
      transcript.appendChild(p);
    });
  }

  function render(t) {
    progress.style.width = (t / DURATION * 100) + '%';
    progress.setAttribute('aria-valuenow', Math.floor(t));
    body.classList.toggle('corner', t >= 10);
    renderWords(t);
    renderApp(t);
  }

  var t = 0;
  var last = null;
  var m = /(?:^|[#&?])t=(\d+(?:\.\d+)?)/.exec(location.hash + location.search);
  if (m) {
    t = Math.min(DURATION, parseFloat(m[1]));
    // A seek (rehearsal) shows finished frames; removing the class later would restart the animations.
    body.classList.add('seeked');
  }

  function frame(now) {
    if (last !== null && !paused) t = Math.min(DURATION, t + Math.min(0.25, (now - last) / 1000));
    last = now;
    render(t);
    requestAnimationFrame(frame);
  }

  document.addEventListener('keydown', function (e) {
    if (e.code !== 'Space' && e.key !== ' ') return;
    e.preventDefault();
    if (e.repeat) return;
    if (t >= DURATION) { t = 0; paused = false; body.classList.remove('paused'); return; }
    paused = !paused;
    body.classList.toggle('paused', paused);
  });

  render(t);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
