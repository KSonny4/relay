<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petr Kubelka · Relay · Two minutes</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #0a0a0a;
    --muted: #555555;
    --dim: #737373;
    --soft: #f3f3f3;
    --line: #e2e2e2;
    /* 1% of the height of a 16:9 frame that fits the window. */
    --u: min(1vh, 0.5625vw);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: calc(var(--u) * 3);
    line-height: 1.15;
    -webkit-font-smoothing: antialiased;
    cursor: pointer; user-select: none;
  }

  #progress { position: fixed; top: 0; left: 0; height: 6px; width: 0; background: var(--fg); z-index: 10; transition: width .4s ease; }

  #stage {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: calc(var(--u) * 177.78); height: calc(var(--u) * 100);
    display: grid; grid-template-columns: minmax(0, 1fr) calc(var(--u) * 68);
    gap: calc(var(--u) * 7); align-items: center;
    padding: calc(var(--u) * 8) calc(var(--u) * 9) calc(var(--u) * 10) calc(var(--u) * 10.7);
  }

  /* Spoken lines */
  #words { display: flex; flex-direction: column; justify-content: center; gap: calc(var(--u) * 2.2); min-height: 0; }
  .lockup { display: grid; gap: calc(var(--u) * 1); margin-bottom: calc(var(--u) * 1.5); }
  .lockup .name { font-size: calc(var(--u) * 4.4); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
  .lockup .brand { font-size: calc(var(--u) * 15); font-weight: 900; letter-spacing: -0.045em; line-height: .9; }
  .line {
    font-size: calc(var(--u) * var(--fs, 7)); font-weight: 800; letter-spacing: -0.025em; line-height: 1.08;
    text-wrap: balance;
    animation: rise .5s ease both; animation-delay: calc(var(--i, 0) * 90ms);
  }
  .line .em { font-weight: 900; text-decoration: underline; text-decoration-thickness: .07em; text-underline-offset: .14em; }
  body.still .line { animation: none; }
  @keyframes rise { from { opacity: 0; transform: translateY(calc(var(--u) * 2.5)); } }

  /* Product */
  #app {
    background: var(--bg); border: 2px solid var(--line); border-radius: calc(var(--u) * 2.4);
    box-shadow: 0 calc(var(--u) * 2) calc(var(--u) * 6) rgba(0, 0, 0, .08);
    display: grid; grid-template-columns: minmax(0, 1fr); overflow: hidden; padding-bottom: calc(var(--u) * 3);
    max-height: calc(var(--u) * 82);
    opacity: 0; transform: translateY(calc(var(--u) * 3));
    transition: opacity .5s ease, transform .5s ease;
  }
  body.app-on #app { opacity: 1; transform: none; }
  .bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: calc(var(--u) * 1.8) calc(var(--u) * 3); border-bottom: 2px solid var(--line);
    font-size: calc(var(--u) * 2.8); font-weight: 800;
  }
  .rec { display: inline-flex; align-items: center; gap: calc(var(--u) * 1.2); color: var(--muted); }
  .rec i { width: calc(var(--u) * 2); height: calc(var(--u) * 2); border-radius: 50%; background: var(--fg); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  .criteria { padding: calc(var(--u) * 2.6) calc(var(--u) * 3) calc(var(--u) * .6); display: grid; gap: calc(var(--u) * 1.8); }
  .crit {
    display: grid; grid-template-columns: calc(var(--u) * 20) 1fr calc(var(--u) * 13);
    align-items: center; gap: calc(var(--u) * 2);
    font-size: calc(var(--u) * 3.2); font-weight: 800; color: var(--line);
    transition: color .4s ease;
  }
  .crit.on { color: var(--fg); }
  .crit .w { font-weight: 700; color: var(--dim); font-size: .8em; margin-left: .3em; }
  .crit:not(.on) .w { color: var(--line); }
  .crit .val { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; font-size: calc(var(--u) * 4.4); font-weight: 900; }
  .crit .val small { font-size: .5em; font-weight: 800; color: var(--dim); }
  .pips { display: grid; grid-template-columns: repeat(5, 1fr); gap: calc(var(--u) * .7); }
  .pips b { height: calc(var(--u) * 1.6); border-radius: 999px; background: var(--line); overflow: hidden; position: relative; }
  .pips b::after { content: ""; position: absolute; inset: 0; width: var(--fill, 0%); background: var(--fg); transition: width .6s ease; }

  .total {
    margin: calc(var(--u) * 1.4) calc(var(--u) * 3) 0; padding-top: calc(var(--u) * 2);
    border-top: 2px solid var(--fg);
    display: none; grid-template-columns: minmax(0, 1fr); gap: calc(var(--u) * 1.4);
  }
  body.total-on .total { display: grid; }
  .sum { font-size: calc(var(--u) * 3.4); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.3; white-space: nowrap; }
  .sum span { color: var(--dim); font-weight: 700; }
  .sum small { display: block; font-size: calc(var(--u) * 2.3); font-weight: 700; color: var(--dim); }
  .score { display: flex; align-items: baseline; gap: calc(var(--u) * 1.2); font-variant-numeric: tabular-nums; }
  .score .num { font-size: calc(var(--u) * 12); font-weight: 900; letter-spacing: -0.05em; line-height: .85; }
  .score .of { font-size: calc(var(--u) * 4.4); font-weight: 800; color: var(--muted); }

  .fix {
    margin: calc(var(--u) * 2.4) calc(var(--u) * 3) 0;
    border-left: calc(var(--u) * 0.8) solid var(--fg); background: var(--soft);
    padding: calc(var(--u) * 1.2) calc(var(--u) * 1.8);
    font-size: calc(var(--u) * 2.6); font-weight: 700; line-height: 1.3;
    display: none;
  }
  body.fix-on .fix { display: block; }
  .fix-label { display: block; font-size: calc(var(--u) * 2.1); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin-bottom: calc(var(--u) * .5); }

  #corner {
    position: absolute; left: calc(var(--u) * 10.7); bottom: calc(var(--u) * 3.4);
    font-size: calc(var(--u) * 2.8); font-weight: 800; letter-spacing: .04em; color: var(--muted);
  }
  #corner b { color: var(--fg); font-weight: 900; }
  body.first #corner { opacity: 0; }

  #nav {
    position: absolute; right: calc(var(--u) * 9); bottom: calc(var(--u) * 2.6);
    display: flex; align-items: center; gap: calc(var(--u) * 1.6);
    font-size: calc(var(--u) * 2.6); font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  #nav button {
    width: calc(var(--u) * 5.2); height: calc(var(--u) * 5.2); border-radius: 50%;
    border: 2px solid var(--line); background: var(--bg); color: var(--fg);
    font: inherit; font-size: calc(var(--u) * 3); line-height: 1; cursor: pointer;
  }
  #nav button:hover { border-color: var(--fg); }
  #nav button:disabled { color: var(--line); border-color: var(--line); cursor: default; }

  @media (prefers-reduced-motion: reduce) {
    .line { animation: none; }
    .rec i { animation: none; }
  }
</style>
</head>
<body class="first">
<div id="progress" aria-hidden="true"></div>

<main id="stage">
  <div id="words" aria-live="polite"></div>
  <section id="app" aria-label="Relay">
    <div class="bar"><span>Relay</span><span class="rec"><i></i>Live</span></div>
    <div class="criteria" id="criteria"></div>
    <div class="total">
      <div class="sum" id="sum"></div>
      <div class="score"><span class="num" id="total">–</span><span class="of">/ 20</span></div>
    </div>
    <div class="fix"><span class="fix-label">Line to fix</span><span id="fix-text"></span></div>
  </section>
  <div id="corner">Petr Kubelka · <b>Relay</b></div>
  <nav id="nav" aria-label="Scenes">
    <button type="button" id="prev" aria-label="Previous scene">‹</button>
    <span id="count">1 / 5</span>
    <button type="button" id="next" aria-label="Next scene">›</button>
  </nav>
</main>

<script>
(function () {
  // Scenes 1–5 are the one-minute deck, word for word: the "60 seconds" section of pitch.md,
  // one scene per timestamp. Scenes 6–8 add how a take works, the technologies and what is next.
  // *Asterisks* mark emphasised words.
  var SCENES = [
    [
      'Hackathon teams find out their pitch failed only after they sit down.',
      'By then the judges have moved on, and nobody tells you which sentence lost them.'
    ],
    [
      '*Relay* fixes that before you stand up.',
      'You say your pitch out loud, and Relay scores it on execution, usefulness and clarity, each from 1 to 5.',
      'The total is execution times two plus usefulness plus clarity, *out of 20.*',
      'Then it gives you *one line to fix.*',
      'Not a list.',
      'One line.',
      'You fix that line, say it again, and the number climbs.'
    ],
    [
      'That is *working right now.*',
      'The live app is beside me, and it is scoring these exact words while I say them.',
      'I am pitching *Relay* on *Relay*.'
    ],
    [
      'Today I am building it.',
      'Next, every team at this hackathon rehearses with it before they present.'
    ],
    [
      'So here is what to try next: say your pitch to Relay, fix the one line it gives you, and *walk in already knowing your number.*'
    ],
    [
      '*How a take works.*',
      'You speak.',
      'The words show with their times.',
      'The three scores and the total out of 20 update.',
      'One line says *what to fix.*'
    ],
    [
      '*Technologies,* only the ones that do that job.',
      '*Deepgram* turns speech into text.',
      '*Jev* scores the three questions from 1 to 5.',
      'The total is Execution × 2 + Usefulness + Clarity, out of 20.',
      'One model writes the single line to fix.'
    ],
    [
      '*What’s next.*',
      'Today Relay judges this hackathon’s three questions: Execution, Usefulness and Clarity.',
      'Next, *the same critic for other hackathons.*'
    ]
  ];

  // Jev (jev-latest) scored these exact words once per judging criterion on a
  // 1–5 scale: Execution 4.55, Usefulness 4.85, Clarity 4.97. Shown to one decimal.
  // `from` is the scene where each criterion is first shown.
  var CRITERIA = [
    { name: 'Execution', weight: 2, score: 4.6, from: 2 },
    { name: 'Usefulness', weight: 1, score: 4.9, from: 1 },
    { name: 'Clarity', weight: 1, score: 5.0, from: 1 }
  ];
  var TOTAL_FROM = 2;
  var FIX_FROM = 1;
  // Relay's one-sentence improvement for these exact words.
  var FIX_TEXT = 'Highlight the unique value proposition of Relay by emphasizing how it not only improves pitch success rates but also enhances overall communication skills for developers.';

  var body = document.body;
  var wordsEl = document.getElementById('words');
  var critEl = document.getElementById('criteria');
  var sumEl = document.getElementById('sum');
  var totalEl = document.getElementById('total');
  var progress = document.getElementById('progress');
  var count = document.getElementById('count');
  var prevBtn = document.getElementById('prev');
  var nextBtn = document.getElementById('next');
  document.getElementById('fix-text').textContent = '“' + FIX_TEXT + '”';

  function fmt(x) { return x.toFixed(1); }
  function plain(s) { return s.replace(/\*/g, ''); }
  function html(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/\*([^*]+)\*/g, '<span class="em">$1</span>');
  }

  var rows = CRITERIA.map(function (c) {
    var row = document.createElement('div');
    row.className = 'crit';
    row.innerHTML = '<span>' + c.name + (c.weight > 1 ? '<span class="w">×' + c.weight + '</span>' : '') + '</span>' +
      '<span class="pips">' + '<b></b><b></b><b></b><b></b><b></b>' + '</span>' +
      '<span class="val">–</span>';
    critEl.appendChild(row);
    return row;
  });

  var total = CRITERIA.reduce(function (a, c) { return a + c.weight * c.score; }, 0);
  sumEl.innerHTML = CRITERIA.map(function (c) {
    return fmt(c.score) + (c.weight > 1 ? ' <span>×</span> ' + c.weight : '');
  }).join(' <span>+</span> ') + ' <span>=</span>' +
    '<small>' + CRITERIA.map(function (c) { return c.name + (c.weight > 1 ? ' × ' + c.weight : ''); }).join(' + ') + '</small>';

  // Text size per scene so the whole scene fits the left column.
  function fitSize(lines) {
    var chars = lines.reduce(function (a, l) { return a + plain(l).length; }, 0);
    var area = 78 * 64 - lines.length * 2.2 * 78;
    return Math.max(4.2, Math.min(7.4, Math.sqrt(area / (chars * 0.6))));
  }

  var scene = -1;
  var opened = false;

  function show(n) {
    n = Math.max(0, Math.min(SCENES.length - 1, n));
    if (n === scene) return;
    scene = n;
    history.replaceState(null, '', '#' + (n + 1));

    body.classList.toggle('first', n === 0);
    body.classList.toggle('app-on', n >= 1);
    body.classList.toggle('total-on', n >= TOTAL_FROM);
    body.classList.toggle('fix-on', n >= FIX_FROM);
    progress.style.width = ((n + 1) / SCENES.length * 100) + '%';
    count.textContent = (n + 1) + ' / ' + SCENES.length;
    prevBtn.disabled = n === 0;
    nextBtn.disabled = n === SCENES.length - 1;

    // The opening frame is shown still; lines move in only when the viewer changes scene.
    body.classList.toggle('still', !opened);
    opened = true;
    wordsEl.innerHTML = '';
    if (n === 0) {
      wordsEl.insertAdjacentHTML('beforeend', '<div class="lockup"><div class="name">Petr Kubelka</div><div class="brand">Relay</div></div>');
    }
    var fs = fitSize(SCENES[n]);
    SCENES[n].forEach(function (l, i) {
      var p = document.createElement('p');
      p.className = 'line';
      p.style.setProperty('--fs', fs.toFixed(2));
      p.style.setProperty('--i', i);
      p.innerHTML = html(l);
      wordsEl.appendChild(p);
    });

    CRITERIA.forEach(function (c, i) {
      var on = n >= c.from;
      rows[i].classList.toggle('on', on);
      rows[i].querySelector('.val').innerHTML = on ? fmt(c.score) + '<small> / 5</small>' : '–';
      Array.prototype.forEach.call(rows[i].querySelectorAll('.pips b'), function (b, k) {
        b.style.setProperty('--fill', on ? Math.max(0, Math.min(1, c.score - k)) * 100 + '%' : '0%');
      });
    });
    totalEl.textContent = n >= TOTAL_FROM ? fmt(total) : '–';
  }

  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || k === ' ' || k === 'Enter') { e.preventDefault(); show(scene + 1); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || k === 'Backspace') { e.preventDefault(); show(scene - 1); }
    else if (k === 'Home') { e.preventDefault(); show(0); }
    else if (k === 'End') { e.preventDefault(); show(SCENES.length - 1); }
  });
  prevBtn.addEventListener('click', function (e) { e.stopPropagation(); show(scene - 1); });
  nextBtn.addEventListener('click', function (e) { e.stopPropagation(); show(scene + 1); });
  document.addEventListener('click', function (e) {
    show(e.clientX < window.innerWidth * 0.25 ? scene - 1 : scene + 1);
  });

  var start = parseInt((location.hash.match(/^#(\d+)$/) || [])[1], 10);
  show(isNaN(start) ? 0 : start - 1);
})();
</script>
</body>
</html>
