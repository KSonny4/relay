databases:
  - name: relay-postgres
    databaseName: relay
    user: relay
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: relay-server
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/sessions
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: relay-postgres
          property: connectionString
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TYPESAFE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
